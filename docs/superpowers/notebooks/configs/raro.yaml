# Config livekit-wakeword 0.2.1 — TOGGLE de palavra unica 'Raro' (ADR-0024)
# NAO ha gravar/parar. target unico 'raro'. Treinar COM ACAV (sem --skip-acav) p/ FP robusto em background.
# Negativos = palavras-rima PT-BR (caro/faro/barro/raio...) contra FP de palavra curta.

model_name: raro
target_phrases:
- raro
custom_negative_phrases:
- caro
- faro
- barro
- raio
- claro
- carro
- raro nao
- raró

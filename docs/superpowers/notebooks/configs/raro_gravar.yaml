# n_samples por classe. LOTE CHEIO desta rodada (a 0025 rodou só 2000 via heredoc — NUNCA 15000).
# VoxCPM é lento (~3-4s/clip) → vigiar o contador de clips e o crédito. n_samples_val ~20%.
n_samples: 15000
n_samples_val: 3000

model:
  model_type: conv_attention   # conv_attention (melhor FP) | dnn | rnn
  model_size: small            # MANTER small — medium piora overfit no sintético (gap síntese→real)

steps: 50000
target_fp_per_hour: 0.2        # limiar de falso-positivo usado no eval/DET

# (output_format omitido — ONNX é o default; o export gera <model_name>.onnx por padrão.)

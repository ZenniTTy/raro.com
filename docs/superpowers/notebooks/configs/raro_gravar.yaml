# Config livekit-wakeword 0.2.1 — comando START ("Raro gravar") → raro_gravar.onnx
# Campos validados na fonte primária (github.com/livekit/livekit-wakeword + docs.livekit.io).
# Piper gera só INGLÊS por padrão → qualquer outro idioma usa voxcpm (doc oficial).
#
# === RE-TREINO (sessão 0028, pós-gate de recall 0027) ===
# O modelo de PROVA (n_samples=2000, 14 prompts, SEM custom negatives) reprovou no gate de voz REAL
# no iPhone 12: raro_gravar topou em score 0.213 (precisa 0.34) — falha de RECALL por gap síntese→real.
# Correção principal (causa-raiz provada device + docs livekit): mais diversidade de vozes sintéticas
# (prompts 14→~80) + lote cheio (n_samples=15000, NUNCA executado — a 0025 rodou 2000 via heredoc).
# Hard negatives (custom_negative_phrases) = insurance secundária contra cross-fire, modesta no gravar
# (compartilha onset "raro" → pode deprimir recall já fraco; gated no teste de device).
# Decisão 5a: 1 modelo por frase (este detecta SÓ "raro gravar"); o STOP está em raro_parar.yaml.

model_name: raro_gravar
target_phrases:
  - "raro gravar"

# custom_negative_phrases (sintaxe verificada em fonte primária, tag v0.2.1: config.py:122
# `custom_negative_phrases: list[str]`, generate.py:390-391 `.extend()` antes do TTS synth).
# Nível RAIZ (sibling de target_phrases), lista de STRINGS PT-BR sintetizadas por VoxCPM.
# Compartilham o orçamento único de negativos (sem count por frase) → repetir 3x + variantes p/ "morder".
# MODESTO no gravar (3x): "raro parar" compartilha o onset "raro"; o trainer 3-fases dobra
# max_negative_weight se FPPH>target → negativo agressivo num modelo recall-fraco pode piorar recall.
# Se o gate de device mostrar recall regredida, remover este bloco e re-treinar só com prompts+samples.
custom_negative_phrases:
  - "raro parar"
  - "raro parar"
  - "raro parar"
  - "raro para"
  - "raro pra"

tts_backend: voxcpm
# voice_design_prompts: descrições de vozes (VoxCPM desenha a voz a partir do prompt). A frase-alvo
# (target_phrases) sai em PT-BR. Aviso oficial: acurácia multilíngue menor → MAIS prompts = MAIS
# diversidade de locutores = fecha o gap síntese→real (a correção load-bearing desta rodada).
# ~80 personas variando idade/gênero/pitch/ritmo/sotaque regional BR/energia/distância/ambiente.

name: raro_mobile
description: "Raro Camera — hands-free professional video capture (iOS + Android)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — Riverpod 3 com codegen (Blueprint 2.1)
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing (Blueprint 2.1)
  go_router: ^17.2.3

  # Subscription (Blueprint 2.4)
  purchases_flutter: ^10.1.1

  # Firebase (Blueprint 2.6)
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2

  # Persistence + permissions + share (Blueprint 2.7)
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^13.1.0
  device_info_plus: ^13.1.0

  # i18n (Blueprint 2.8)
  intl: ^0.20.2

  # Logging
  logger: ^2.7.0

  cupertino_icons: ^1.0.8

  # Theme tokens (Theme Tailor codegen annotation runtime)
  theme_tailor_annotation: ^3.1.3

  # XML parsing (anti-drift tooling)
  xml: ^6.5.0

  # Shared workspace package (constants, enums, event names)
  raro_shared:
    path: ../../packages/shared

  # Freezed sealed unions (domain states)
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.15.0
  pigeon: ^26.3.2
  riverpod_generator: ^4.0.3
  theme_tailor: ^3.1.3
  freezed: ^3.2.5

  # Lints
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.3

  # Testing (Blueprint 2.9)
  alchemist: ^0.14.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # Fonts (Space Grotesk, Inter, JetBrains Mono — Blueprint 4.3) e assets
  # (logo, ícones) são adicionados em sprints subsequentes da Fase 5 quando o
  # tema for implementado.
